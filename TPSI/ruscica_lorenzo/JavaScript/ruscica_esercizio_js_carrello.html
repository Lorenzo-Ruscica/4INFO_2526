<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons">
    <link rel="stylesheet" href="ruscica_esercizio_js_carrello.css">
    <script src="ruscica_esercizio_js_carello.js" defer></script>
    <title>Carrello JS</title>
</head>
<body>
    <h1 class="main-title">Carrello JS</h1>

    <table id="carrello">
        <tr>
            <th>Prodotto</th>
            <th>Quantità</th>
            <th>Costo</th>
            <th></th>
            <th></th>
        </tr>

        <tr>
            <td><input id="prodoo" type="text" size="30" placeholder="Nome prodotto" /></td>
            <td><input id="qty" type="number" min="1" placeholder="1" /></td>
            <td><input id="costo" type="number" min="1" placeholder="€" /></td>
            <td>
                <span class="material-icons icon" onclick="aggiungi()">add</span>
            </td>
            <td>
                <span class="material-icons icon" onclick="totale()">functions</span>
            </td>
        </tr>

        <tr>
            <td>USB Stick</td>
            <td><input id="qty_1" type="number" min="1" value="2" onchange="aggiornaTotale()" /></td>
            <td>3.99 €</td>
            <td class="importo">7.98 €</td>
            <td><span class="material-icons icon-remove" style="cursor:pointer" onclick="this.closest('tr').remove(); aggiornaTotale();">remove_shopping_cart</span></td>
        </tr>

        <tr>
            <td>SSD 1TB</td>
            <td><input id="qty_2" type="number" min="1" value="1" onchange="aggiornaTotale()" /></td>
            <td>56 €</td>
            <td class="importo">56 €</td>
            <td><span class="material-icons icon-remove" style="cursor:pointer" onclick="this.closest('tr').remove(); aggiornaTotale();">remove_shopping_cart</span></td>
        </tr>

        <tr>
            <td>Cavo USB-C</td>
            <td><input id="qty_3" type="number" min="1" value="5" onchange="aggiornaTotale()" /></td>
            <td>1.99 €</td>
            <td class="importo">9.95 €</td>
            <td><span class="material-icons icon-remove" style="cursor:pointer" onclick="this.closest('tr').remove(); aggiornaTotale();">remove_shopping_cart</span></td>
        </tr>

        <tr>
            <td colspan="4"><hr></td>
        </tr>

        <tr>
            <td colspan="3">TOTALE</td>
            <td>73.93 €</td>
        </tr>
    </table>
</body>
</html>
